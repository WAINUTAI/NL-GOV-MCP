name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Type-check, build & unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests (offline, mocked)
        run: npm test

# NOTE: the live acceptance suite (`npm run test:acceptance`) hits real Dutch
# government APIs and is intentionally NOT run in CI: US-based runners can be
# geo-blocked and several upstreams are intermittently unavailable, which would
# keep the job perpetually red. Run it locally when validating connectors.
